<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,follow"><title>Random game</title></head><body><p>Choosing a game…</p><script>(async()=>{try{const r=await fetch("/search-index.json");const d=await r.json();if(d.length){const g=d[Math.floor(Math.random()*d.length)];location.replace(g.url);return;}}catch(e){}location.replace("/");})();</script></body></html>
