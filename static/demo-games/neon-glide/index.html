<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#05070b;color:#fff;font-family:Arial}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;top:18px;left:18px;font-weight:bold;letter-spacing:1px}.controls{position:fixed;left:0;right:0;bottom:18px;display:flex;justify-content:center;gap:15px}.controls button{width:76px;height:56px;border-radius:15px;border:1px solid #ffffff33;background:#111927cc;color:#c7ff4a;font-size:26px;touch-action:none}</style><script>window.ARCADEFLOW_PUBLIC_API="https://api.unblocked-games-66.org";window.ARCADEFLOW_PUBLIC_API_SITE="town-of-salem";</script></head><body><canvas></canvas><div class="ui">SCORE <span id="score">0</span></div><div class="controls"><button id="l">◀</button><button id="r">▶</button></div><script>
const c=document.querySelector('canvas'),x=c.getContext('2d'),scoreEl=document.querySelector('#score');let W,H,dpr,player,obs=[],orbs=[],score=0,speed=5,dead=false,left=false,right=false;
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){player={x:W/2,y:H-90,r:17};obs=[];orbs=[];score=0;speed=5;dead=false}reset();
function key(e,v){if(['ArrowLeft','a','A'].includes(e.key))left=v;if(['ArrowRight','d','D'].includes(e.key))right=v;if(e.key===' '&&dead)reset()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));
for(const [id,set] of [['l',v=>left=v],['r',v=>right=v]]){const b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();set(true)};b.onpointerup=b.onpointercancel=e=>set(false)}
function spawn(){if(Math.random()<.035)obs.push({x:40+Math.random()*(W-80),y:-40,w:45+Math.random()*70,h:18});if(Math.random()<.018)orbs.push({x:30+Math.random()*(W-60),y:-20,r:8})}
function hit(a,b){return a.x+a.r>b.x-b.w/2&&a.x-a.r<b.x+b.w/2&&a.y+a.r>b.y-b.h/2&&a.y-a.r<b.y+b.h/2}
function loop(){x.fillStyle='#05070b';x.fillRect(0,0,W,H);x.strokeStyle='#132331';x.lineWidth=1;for(let i=0;i<W;i+=50){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}if(!dead){if(left)player.x-=7;if(right)player.x+=7;player.x=Math.max(20,Math.min(W-20,player.x));spawn();score+=.04;speed=5+score/120;for(const o of obs)o.y+=speed;for(const o of orbs)o.y+=speed*.85;obs=obs.filter(o=>o.y<H+50);orbs=orbs.filter(o=>{if(Math.hypot(o.x-player.x,o.y-player.y)<26){score+=15;return false}return o.y<H+30});if(obs.some(o=>hit(player,o)))dead=true}x.shadowBlur=20;x.shadowColor='#5de7ff';x.fillStyle='#5de7ff';x.beginPath();x.arc(player.x,player.y,player.r,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#ff4d6d';for(const o of obs)x.fillRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);x.fillStyle='#c7ff4a';for(const o of orbs){x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()}scoreEl.textContent=Math.floor(score);if(dead){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.font='700 38px Arial';x.fillText('RUN OVER',W/2,H/2-10);x.font='18px Arial';x.fillStyle='#c7ff4a';x.fillText('Press Space or reload',W/2,H/2+30)}requestAnimationFrame(loop)}loop();
</script></body></html>
