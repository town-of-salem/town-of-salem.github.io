<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>body{margin:0;overflow:hidden;background:#080b10;color:white;font-family:Arial}canvas{width:100vw;height:100vh;display:block}.ui{position:fixed;top:18px;left:18px;font-weight:bold}.pad{position:fixed;bottom:18px;left:0;right:0;text-align:center}.pad button{width:80px;height:55px;margin:5px;border:1px solid #ffffff25;border-radius:14px;background:#161d27dd;color:#c7ff4a;font-size:26px;touch-action:none}</style><script>window.ARCADEFLOW_PUBLIC_API="https://api.unblocked-games-66.org";window.ARCADEFLOW_PUBLIC_API_SITE="town-of-salem";</script></head><body><canvas></canvas><div class="ui">DISTANCE <span id="s">0</span></div><div class="pad"><button id="l">◀</button><button id="r">▶</button></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),out=document.querySelector('#s');let W,H,dpr,car,t=0,score=0,dead=false,L=false,R=false;function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);reset()}addEventListener('resize',size);function reset(){car={x:W/2,y:H*.72,a:0};score=0;dead=false}size();
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')L=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')R=true;if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')L=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')R=false});for(const[id,set]of[['l',v=>L=v],['r',v=>R=v]]){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();set(true)};b.onpointerup=b.onpointercancel=e=>set(false)}
function roadX(y){return W/2+Math.sin((y+t)/145)*Math.min(170,W*.22)}function loop(){t+=2.8;g.fillStyle='#070a0f';g.fillRect(0,0,W,H);g.lineWidth=Math.min(220,W*.42);g.strokeStyle='#1c2530';g.beginPath();for(let y=-20;y<H+20;y+=8){let xx=roadX(y);y?g.lineTo(xx,y):g.moveTo(xx,y)}g.stroke();g.lineWidth=4;g.strokeStyle='#ff8e3c';g.setLineDash([18,16]);g.stroke();g.setLineDash([]);if(!dead){car.a+=(R-L)*.045;car.a*=.91;car.x+=car.a*10;let center=roadX(car.y);if(Math.abs(car.x-center)>Math.min(115,W*.22)){dead=true}else score+=.12}g.save();g.translate(car.x,car.y);g.rotate(car.a*.35);g.fillStyle='#c7ff4a';g.fillRect(-34,-18,68,36);g.fillStyle='#111';g.fillRect(-12,-12,28,24);g.restore();out.textContent=Math.floor(score);if(dead){g.fillStyle='#000b';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#fff';g.font='700 38px Arial';g.fillText('OFF TRACK',W/2,H/2);g.fillStyle='#ff8e3c';g.font='18px Arial';g.fillText('Press R or reload',W/2,H/2+35)}requestAnimationFrame(loop)}loop();
</script></body></html>
