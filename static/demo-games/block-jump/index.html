<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>body{margin:0;overflow:hidden;background:#0d0917;color:#fff;font-family:Arial}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;top:18px;left:18px;font-weight:bold}</style><script>window.ARCADEFLOW_PUBLIC_API="https://api.unblocked-games-66.org";window.ARCADEFLOW_PUBLIC_API_SITE="town-of-salem";</script></head><body><canvas></canvas><div class="ui">SCORE <span id="s">0</span></div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),s=document.querySelector('#s');let W,H,dpr,p,obs,score,dead;function size(){dpr=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);reset()}function reset(){p={x:W*.22,y:H-100,v:0,ground:H-80};obs=[];score=0;dead=false}addEventListener('resize',size);size();function jump(){if(dead){reset();return}if(p.y>=p.ground-1)p.v=-16}addEventListener('keydown',e=>{if(e.key===' '||e.key.toLowerCase()==='r')jump()});addEventListener('pointerdown',jump);
function loop(){g.fillStyle='#0d0917';g.fillRect(0,0,W,H);g.strokeStyle='#5de7ff';g.lineWidth=6;g.beginPath();g.moveTo(0,H-55);g.lineTo(W,H-55);g.stroke();if(!dead){p.v+=.75;p.y+=p.v;if(p.y>p.ground){p.y=p.ground;p.v=0}if(Math.random()<.018)obs.push({x:W+40,w:34+Math.random()*30,h:45+Math.random()*55});for(const o of obs)o.x-=7+score/300;obs=obs.filter(o=>{if(o.x+o.w<0){score+=10;return false}if(p.x+28>o.x&&p.x-28<o.x+o.w&&p.y+28>H-55-o.h)dead=true;return true});score+=.04}g.save();g.translate(p.x,p.y);g.rotate(p.v*.025);g.fillStyle='#c7ff4a';g.fillRect(-28,-28,56,56);g.restore();g.fillStyle='#ff5c8a';for(const o of obs){g.beginPath();g.moveTo(o.x,H-55);g.lineTo(o.x+o.w/2,H-55-o.h);g.lineTo(o.x+o.w,H-55);g.fill()}s.textContent=Math.floor(score);if(dead){g.fillStyle='#000b';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='700 38px Arial';g.fillText('TRY AGAIN',W/2,H/2);g.fillStyle='#5de7ff';g.font='18px Arial';g.fillText('Tap or press Space',W/2,H/2+34)}requestAnimationFrame(loop)}loop();
</script></body></html>
